<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--BASE-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>analyzer-ng inspector</title>
  <link rel="preconnect" href="">
  <link rel="stylesheet" href="static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
  <script src="static/vendor/echarts.min.js"></script>
  <script src="static/vendor/echarts-gl.min.js"></script>
  <script src="static/vendor/d3.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" style="color: var(--rp-topaz)"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.99994 1.46161L1.41877 8.0003L7.99994 14.539L14.5811 8.0003L7.99994 1.46161ZM8.28187 0.332062C8.12587 0.177072 7.87401 0.177073 7.71801 0.332063L0.285555 7.71654C0.128122 7.87296 0.128122 8.12764 0.285555 8.28405L7.71801 15.6685C7.87401 15.8235 8.12586 15.8235 8.28186 15.6685L15.7144 8.28405C15.8718 8.12764 15.8718 7.87295 15.7144 7.71654L8.28187 0.332062Z" fill="currentColor"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M8.00786 4.98127L4.9132 8.01519L8.00783 11.1798L11.0896 8.01517L8.00786 4.98127ZM8.28936 3.85512C8.1339 3.70208 7.88449 3.70182 7.72871 3.85454L3.78523 7.72061C3.62762 7.87513 3.62495 8.1281 3.77927 8.28591L7.72274 12.3186C7.87987 12.4793 8.1385 12.479 8.29529 12.318L12.2224 8.28532C12.3759 8.12766 12.3733 7.87559 12.2165 7.7212L8.28936 3.85512Z" fill="currentColor"/></svg></span>
      <div class="brand-text">
        <span class="brand-title">analyzer&#8209;ng <b>inspector</b></span>
        <span class="brand-sub" id="rp-status" title="ReportPortal name resolution status">RP names: —</span>
      </div>
    </div>

    <div class="topbar-controls">
      <label class="field">
        <span class="field-label">Project</span>
        <select id="project-select" class="select"></select>
      </label>
      <div class="counters" id="counters" aria-live="polite"></div>
      <label class="toggle" title="Poll every 10s">
        <input type="checkbox" id="autorefresh">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Auto‑refresh</span>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" data-view="journey" role="tab">Item Journey</button>
    <button class="tab" data-view="signatures" role="tab">Signatures</button>
    <button class="tab" data-view="drain" role="tab">Drain3 Explorer</button>
    <button class="tab" data-view="modes" role="tab">Modes Map 3D</button>
    <button class="tab" data-view="groups" role="tab">Launch Groups</button>
    <button class="tab" data-view="loop" role="tab">Learning Loop</button>
    <button class="tab" data-view="llm" role="tab">LLM</button>
    <button class="tab" data-view="rubric" role="tab">Cold-start Rules</button>
  </nav>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="static/js/app.js"></script>
</body>
</html>
