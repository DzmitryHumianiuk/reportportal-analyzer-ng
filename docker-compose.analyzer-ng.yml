# analyzer-ng overlay for a standard ReportPortal docker-compose (spec 01 §7.2).
#
# Apply on top of the stock RP compose:
#
#     docker-compose -f docker-compose.yml -f docker-compose.analyzer-ng.yml up -d
#
# What it does:
#   * Replaces the legacy `analyzer` service with the analyzer-ng image (same
#     service NAME so RP's healthchecks/depends_on keep referencing it).
#   * Neutralizes `analyzer-train` and `opensearch` by moving them behind a
#     never-enabled compose profile — a compose overlay cannot delete a base
#     service, but a service gated by an unselected profile does not start.
#     analyzer-ng folds training into the single service and drops OpenSearch
#     entirely (all state is in PostgreSQL). You may also delete these two
#     services (and the opensearch volume) from the base file outright.
#   * Reuses the existing `postgres` instance but a SEPARATE database `analyzer`
#     (auto-created at startup; ANALYZER_PG_CREATE_DB=true). The `reportportal`
#     database is never touched.
#   * Adds an optional `ollama` sidecar under the `llm` profile with a named
#     volume (only starts with `--profile llm`).
#
# Env expected from the RP compose / .env (already set there):
#   RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS, POSTGRES_USER, POSTGRES_PASSWORD

services:
  analyzer:
    image: analyzer-ng:latest
    # Build locally when not using a pre-built image:
    #   docker-compose -f docker-compose.yml -f docker-compose.analyzer-ng.yml build analyzer
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOGGING_LEVEL: info
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      AMQP_VIRTUAL_HOST: analyzer
      AMQP_EXCHANGE_NAME: analyzer
      ANALYZER_PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analyzer
      ANALYZER_PG_CREATE_DB: "true"
      # Enable the optional LLM roles (requires the `ollama` service, profile llm):
      # ANALYZER_LLM_ENABLED: "true"
      # OLLAMA_URL: http://ollama:11434
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5001/health',timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    mem_limit: 2g

  # --- legacy services replaced by analyzer-ng (gated off by profile) --------- #
  analyzer-train:
    profiles: ["legacy-disabled"]

  opensearch:
    profiles: ["legacy-disabled"]

  # --- optional LLM sidecar (spec 04) ----------------------------------------- #
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - "ollama-data:/root/.ollama"
    restart: unless-stopped
    # The model is pulled on first use by analyzer-ng via /api/pull, or pre-pull
    # here with:  docker-compose ... exec ollama ollama pull qwen3:4b-q4_K_M

volumes:
  ollama-data: {}
