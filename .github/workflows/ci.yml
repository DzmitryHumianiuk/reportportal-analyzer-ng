name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Unit tests
        run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    # GitHub-hosted ubuntu runners provide a working Docker daemon, which
    # testcontainers uses to spin pgvector + rabbitmq for these tests.
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Integration tests
        # Stock Docker daemon on the runner: keep the Ryuk reaper enabled
        # (the conftest disables it only as a local default for Colima).
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: uv run pytest -m integration
