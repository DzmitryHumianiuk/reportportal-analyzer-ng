# Synthetic fixture logs for the seed catalog (spec 03 §9, §11 acceptance).
#
# Each positive fixture is a realistic failure excerpt (exception classes + a
# cleaned message + optional Drain template texts) that a human would file under
# `expect`. The suite asserts the catalog's first-matching mode equals `expect`
# for >= 90% of positives, and that none of the benign `negatives` match.
#
# Fixtures are authored to resemble real logs, NOT reverse-engineered from the
# regexes (no overfitting): they carry surrounding context a real log would have.
